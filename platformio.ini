[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_COLOR_DEPTH=16
    -DESP32_CAN_TX_PIN=GPIO_NUM_1
    -DESP32_CAN_RX_PIN=GPIO_NUM_2
    -DGFX_BLIT_BUFFER_SIZE=60   ; Anzahl Zeilen im DMA-Puffer (Standard vermutlich 20)

build_unflags =
    -Wno-deprecated-enum-float-conversion

lib_ldf_mode = deep

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.4
    https://github.com/tamctec/gt911-arduino
    lvgl/lvgl @ ^8.3.11
    ttlappalainen/NMEA2000-library
    https://github.com/offspring/NMEA2000_esp32#add-esp32s3

monitor_speed = 115200
